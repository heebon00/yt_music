<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="YouTube Music Redesign">
  <!--
    음악 플레이어의 관습적인 형태(원 + 재생 삼각형)를 따르되,
    색은 이 리디자인의 강조색(accent #CF032A)을 씁니다.
    공식 마크를 그대로 쓰지 않는 이유는 비공식 재해석 프로젝트이기 때문입니다.
  -->
  <circle cx="16" cy="16" r="16" fill="#CF032A" />
  <circle cx="16" cy="16" r="10.4" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M13.3 11.2 L20.7 16 L13.3 20.8 Z" fill="#FFFFFF" />
</svg>
